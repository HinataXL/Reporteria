<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Insights Desk</title>

    <style>
        :root {
            --bg: #f5f7fb;
            --panel: #ffffff;
            --ink: #07113f;
            --muted: #64708f;
            --line: #dce3f1;
            --violet: #6236ff;
            --violet-dark: #4f2bd9;
            --cyan: #06b6d4;
            --green: #16c784;
            --rose: #ff4d6d;
            --amber: #f59e0b;
            --shadow: 0 24px 80px rgba(31, 41, 85, .16);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                    radial-gradient(circle at 12% 8%, rgba(98, 54, 255, .15), transparent 28rem),
                    radial-gradient(circle at 88% 20%, rgba(6, 182, 212, .14), transparent 26rem),
                    linear-gradient(135deg, #f8fbff 0%, #eef3fb 100%);
            display: grid;
            place-items: center;
            padding: 26px;
        }

        .login-shell {
            width: min(1120px, 100%);
            min-height: 640px;
            display: grid;
            grid-template-columns: 1.12fr .88fr;
            background: var(--panel);
            border: 1px solid rgba(220, 227, 241, .9);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .brand-panel {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            padding: 48px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background:
                    radial-gradient(circle at 16% 78%, rgba(6, 182, 212, .26), transparent 18rem),
                    radial-gradient(circle at 92% 22%, rgba(245, 158, 11, .28), transparent 17rem),
                    linear-gradient(145deg, #ffffff 0%, #f8fbff 64%, #eef4ff 100%);
        }

        .brand-panel::before,
        .brand-panel::after {
            content: "";
            position: absolute;
            z-index: -1;
            border-radius: 999px;
        }

        .brand-panel::before {
            width: 520px;
            height: 520px;
            left: -190px;
            bottom: -230px;
            background: rgba(6, 182, 212, .34);
        }

        .brand-panel::after {
            width: 420px;
            height: 420px;
            right: -150px;
            bottom: -160px;
            background: rgba(98, 54, 255, .16);
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            font-size: 18px;
        }

        .login-brand-logo {
            width: min(430px, 100%);
            height: auto;
            display: block;
            border-radius: 18px;
            box-shadow: 0 22px 52px rgba(7, 17, 63, .16);
        }

        .logo-box {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            box-shadow: 0 16px 36px rgba(98, 54, 255, .28);
        }

        .welcome-copy {
            max-width: 520px;
            margin-top: auto;
            margin-bottom: 58px;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: var(--cyan);
            text-transform: uppercase;
            letter-spacing: .18em;
            font-size: 12px;
            font-weight: 900;
        }

        h1 {
            margin: 0;
            font-size: clamp(42px, 5vw, 72px);
            line-height: .98;
            letter-spacing: 0;
        }

        .welcome-copy p {
            margin: 18px 0 0;
            max-width: 430px;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.55;
            font-weight: 650;
        }

        .shape {
            position: absolute;
            pointer-events: none;
        }

        .shape.line {
            top: 42px;
            left: 98px;
            width: 430px;
            height: 160px;
        }

        .shape.dot-one {
            top: 112px;
            left: 62px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #ffd66b;
        }

        .shape.dot-two {
            top: 110px;
            left: 430px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--rose);
        }

        .shape.arc {
            right: 72px;
            top: 112px;
            width: 54px;
            height: 54px;
            border: 14px solid var(--ink);
            border-left-color: transparent;
            border-bottom-color: transparent;
            border-radius: 50%;
            transform: rotate(-8deg);
        }

        .shape.waves {
            left: 360px;
            bottom: 176px;
            width: 132px;
            height: 44px;
        }

        .shape.triangle {
            left: 200px;
            bottom: 204px;
            color: var(--ink);
        }

        .shape.mini {
            right: 142px;
            bottom: 216px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--amber);
        }

        .form-panel {
            display: grid;
            align-items: center;
            padding: 58px 56px;
            background: #fff;
            border-left: 1px solid var(--line);
        }

        .form-card {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
        }

        .form-card h2 {
            margin: 0;
            font-size: clamp(34px, 4vw, 54px);
            line-height: 1;
            letter-spacing: 0;
        }

        .form-card > p {
            margin: 12px 0 30px;
            color: var(--muted);
            font-weight: 650;
            line-height: 1.5;
        }

        .alert {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 18px;
            padding: 13px 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 800;
        }

        .alert.error {
            color: #b42343;
            background: #fff1f3;
            border: 1px solid #ffd5de;
        }

        .alert.success {
            color: #08784d;
            background: #eafff5;
            border: 1px solid #bdf5d8;
        }

        form {
            display: grid;
            gap: 18px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        .field label {
            color: #263151;
            font-size: 13px;
            font-weight: 900;
        }

        .control {
            position: relative;
        }

        .control svg {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa5bb;
            width: 20px;
            height: 20px;
        }

        input {
            width: 100%;
            height: 58px;
            border: 1.5px solid var(--line);
            border-radius: 999px;
            padding: 0 18px 0 52px;
            color: var(--ink);
            background: #fff;
            outline: none;
            font: inherit;
            font-weight: 760;
            transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
        }

        input::placeholder {
            color: #9aa5bb;
            font-weight: 700;
        }

        input:focus {
            border-color: rgba(98, 54, 255, .54);
            box-shadow: 0 0 0 4px rgba(98, 54, 255, .1);
            background: #fbfdff;
        }

        .password-input {
            padding-right: 58px;
        }

        .icon-button {
            position: absolute;
            right: 12px;
            top: 50%;
            width: 38px;
            height: 38px;
            transform: translateY(-50%);
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #7a849e;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background .16s ease, color .16s ease;
        }

        .icon-button:hover,
        .icon-button:focus-visible {
            color: var(--violet);
            background: #f1efff;
            outline: none;
        }

        .field-error {
            min-height: 16px;
            color: var(--rose);
            font-size: 12px;
            font-weight: 800;
        }

        .submit-button {
            height: 58px;
            margin-top: 4px;
            border: 0;
            border-radius: 999px;
            color: #fff;
            background: linear-gradient(135deg, var(--violet), var(--cyan));
            box-shadow: 0 18px 36px rgba(98, 54, 255, .25);
            cursor: pointer;
            font: inherit;
            font-size: 17px;
            font-weight: 950;
            transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
        }

        .submit-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 22px 42px rgba(98, 54, 255, .3);
        }

        .submit-button:disabled {
            cursor: wait;
            opacity: .82;
            transform: none;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, .4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto;
        }

        .submit-button.loading .button-text {
            display: none;
        }

        .submit-button.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 900px) {
            body {
                padding: 16px;
            }

            .login-shell {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .brand-panel {
                min-height: 300px;
                padding: 32px;
            }

            .welcome-copy {
                margin-bottom: 0;
            }

            .form-panel {
                border-left: 0;
                border-top: 1px solid var(--line);
                padding: 38px 28px;
            }

            .shape.line {
                opacity: .35;
            }
        }

        @media (max-width: 560px) {
            .brand-panel {
                min-height: 230px;
                padding: 24px;
            }

            .welcome-copy p {
                font-size: 15px;
            }

            .shape {
                opacity: .28;
            }

            .form-panel {
                padding: 30px 20px;
            }

            input,
            .submit-button {
                height: 54px;
            }
        }
    </style>
</head>
<body>
<main class="login-shell">
    <section class="brand-panel" aria-label="Bienvenida">
        <div class="brand-mark">
            <img class="login-brand-logo"
                 th:src="@{/sneat/assets/img/brand/insights-desk-logo.png}"
                 alt="Insights Desk">
        </div>

        <svg class="shape line" viewBox="0 0 430 160" fill="none" aria-hidden="true">
            <path d="M10 0c18 110 94 133 118 63 20-58-36-78-58-35-26 51 37 108 121 83C281 85 318 10 430 30" stroke="#07113f" stroke-width="2.2" stroke-linecap="round" opacity=".72"/>
        </svg>
        <span class="shape dot-one" aria-hidden="true"></span>
        <span class="shape dot-two" aria-hidden="true"></span>
        <span class="shape arc" aria-hidden="true"></span>
        <span class="shape mini" aria-hidden="true"></span>
        <svg class="shape waves" viewBox="0 0 132 44" fill="none" aria-hidden="true">
            <path d="M2 8c11 10 21 10 32 0s21-10 32 0 21 10 32 0 21-10 32 0M2 22c11 10 21 10 32 0s21-10 32 0 21 10 32 0 21-10 32 0M2 36c11 10 21 10 32 0s21-10 32 0 21 10 32 0 21-10 32 0" stroke="#07113f" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <svg class="shape triangle" width="48" height="18" viewBox="0 0 48 18" fill="none" aria-hidden="true">
            <path d="M0 0h18L9 12 0 0Zm24 0h18l-9 12-9-12Z" fill="currentColor"/>
        </svg>

        <div class="welcome-copy">
            <p class="eyebrow">Insights Desk</p>
            <h1>Bienvenido de vuelta</h1>
            <p>Ingresa con tu cuenta para continuar con conversaciones, reportería y métricas operativas.</p>
        </div>
    </section>

    <section class="form-panel" aria-label="Formulario de ingreso">
        <div class="form-card">
            <h2>Iniciar sesión</h2>
            <p>Usa tu correo corporativo y contraseña para acceder.</p>

            <div th:if="${param.error}" class="alert error" role="alert">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 8v5m0 4h.01M10.3 3.7 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Usuario o contraseña incorrectos.
            </div>

            <div th:if="${param.logout}" class="alert success" role="status">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="m9 12 2 2 4-5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Sesión cerrada correctamente.
            </div>

            <form th:action="@{/login}" method="post" id="loginForm" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="field">
                    <label for="email">Correo</label>
                    <div class="control">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M4 6h16v12H4V6Zm0 1 8 6 8-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input name="username" id="email" type="email" autocomplete="username" required placeholder="usuario@fixss.com">
                    </div>
                    <span class="field-error" data-error-for="email"></span>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="control">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M7 10V8a5 5 0 0 1 10 0v2m-11 0h12v10H6V10Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input class="password-input" name="password" id="password" type="password" autocomplete="current-password" required placeholder="Ingresa tu contraseña">
                        <button class="icon-button" type="button" id="togglePassword" aria-label="Mostrar contraseña">
                            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" data-error-for="password"></span>
                </div>

                <button type="submit" id="submitButton" class="submit-button">
                    <span class="button-text">Ingresar</span>
                    <span class="spinner" aria-hidden="true"></span>
                </button>
            </form>
        </div>
    </section>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitButton = document.getElementById('submitButton');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const emailError = document.querySelector('[data-error-for="email"]');
        const passwordError = document.querySelector('[data-error-for="password"]');
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
            eyeIcon.innerHTML = isPassword
                ? '<path d="M3 3l18 18M10.7 10.7a3 3 0 0 0 4.1 4.1M9.9 4.2A10.4 10.4 0 0 1 12 4c6.5 0 10 8 10 8a18 18 0 0 1-3.1 4.3M6.6 6.6C3.6 8.6 2 12 2 12s3.5 8 10 8c1.8 0 3.3-.4 4.6-1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
                : '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2"/>';
        });

        form.addEventListener('submit', (event) => {
            emailError.textContent = '';
            passwordError.textContent = '';

            const emailValid = emailRegex.test(emailInput.value.trim());
            const passwordValid = passwordInput.value.trim().length > 0;

            if (!emailValid || !passwordValid) {
                event.preventDefault();
                if (!emailValid) {
                    emailError.textContent = 'Ingresa un correo válido.';
                }
                if (!passwordValid) {
                    passwordError.textContent = 'Ingresa tu contraseña.';
                }
                return;
            }

            submitButton.disabled = true;
            submitButton.classList.add('loading');
        });
    });
</script>
</body>
</html>
