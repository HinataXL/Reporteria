<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Llamada - Insights Desk</title>
    <link rel="stylesheet" th:href="@{/sneat/assets/css/metrics-dashboard.css}">
    <script th:src="@{/sneat/assets/js/error-monitor.js}"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .call-shell {
            max-width: 1120px;
            margin: 0 auto;
            padding: 24px 22px;
        }

        .call-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .call-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .call-form {
            overflow: hidden;
        }

        .form-section {
            padding: 18px;
            border-bottom: 1px solid var(--rm-line);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .form-grid.three {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .field {
            display: grid;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label,
        .section-kicker {
            color: var(--rm-muted);
            font-size: 11px;
            font-weight: 950;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            min-height: 42px;
            border: 1px solid #cfd7e4;
            border-radius: 8px;
            padding: 0 13px;
            color: var(--rm-ink);
            background: #fff;
            font-weight: 760;
            outline: none;
        }

        textarea.form-input {
            min-height: 96px;
            padding: 12px 13px;
            resize: vertical;
        }

        .form-input:focus {
            border-color: #bfb2ff;
            box-shadow: 0 0 0 4px rgba(98, 54, 255, .1);
        }

        .pill-soft {
            width: fit-content;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 950;
            background: #e9f9f0;
            color: #07864a;
        }

        .toggle-card {
            border: 1px solid var(--rm-line);
            border-radius: 10px;
            padding: 14px;
            background: #fbfcff;
        }

        .toggle-card label {
            color: var(--rm-ink);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 900;
            text-transform: none;
            cursor: pointer;
        }

        .toggle-card input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #6236ff;
        }

        .hidden {
            display: none;
        }

        .footer-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 14px 18px;
            background: #fbfcff;
        }

        .error-text {
            color: #d92d55;
            font-size: 12px;
            font-weight: 850;
            margin-top: 8px;
            display: none;
        }

        .save-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 14px;
            border: 1px solid #b7f0cb;
            border-radius: 12px;
            background: #effcf4;
            color: #075f36;
            padding: 14px 16px;
            font-size: 13px;
            font-weight: 900;
            box-shadow: 0 16px 36px rgba(8, 22, 63, .08);
        }

        .save-banner.show {
            display: flex;
        }

        .save-banner button {
            border: 0;
            background: #d8f8e4;
            color: #075f36;
            border-radius: 8px;
            padding: 8px 10px;
            font-weight: 950;
            cursor: pointer;
        }

        .error-text.show {
            display: block;
        }

        @media (max-width: 820px) {
            .call-header {
                grid-template-columns: 1fr;
            }

            .call-actions {
                justify-content: flex-start;
            }

            .form-grid,
            .form-grid.three {
                grid-template-columns: 1fr;
            }
        }

        body.popup-mode .call-shell {
            max-width: none;
            padding: 14px;
        }

        body.popup-mode .call-header {
            position: sticky;
            top: 0;
            z-index: 50;
            margin: -14px -14px 12px;
            padding: 14px;
            background: rgba(247, 251, 255, .94);
            border-bottom: 1px solid var(--rm-line);
            backdrop-filter: blur(14px);
        }
    </style>
</head>
<body class="metrics-body"
      th:classappend="${popupMode} ? ' popup-mode' : ''"
      th:attr="data-popup-mode=${popupMode},data-pip-mode=${pipMode}">
<main class="call-shell">
    <header class="call-header">
        <div>
            <a th:if="${!popupMode}" class="rm-btn ghost" th:href="@{/calls}"><i data-lucide="arrow-left"></i>Volver</a>
            <button th:if="${popupMode}" type="button" class="rm-btn ghost" onclick="CallWorkspace.closeFloatingWindow()"><i data-lucide="x"></i>Cerrar ventana</button>
            <h1 class="page-title" style="margin-top:16px;" th:text="${call.id != null ? 'Editar llamada' : 'Nueva llamada'}">Nueva llamada</h1>
            <p class="page-subtitle">Registro manual de contacto telefonico y seguimiento operativo</p>
        </div>
        <div class="call-actions">
            <span th:if="${popupMode}" class="pill-soft" style="background:#f4f1ff;color:#6236ff;">Ventana flotante</span>
            <span class="pill-soft">Sistema activo</span>
            <span id="draftStatus" class="pill-soft" style="background:#f4f1ff;color:#6236ff;">Borrador listo</span>
            <button class="rm-btn primary" type="submit" form="callForm"><i data-lucide="save"></i>Guardar</button>
        </div>
    </header>

    <form id="callForm"
          class="card call-form"
          method="post"
          th:object="${call}"
          th:action="${call.id != null} ? @{/calls/update/{id}(id=${call.id})} : @{/calls/save}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" id="callId" th:value="${call.id}">
        <input type="hidden"
               id="fechaInicio"
               name="fechaInicio"
               th:value="${call.fechaInicio != null ? #temporals.format(call.fechaInicio, 'yyyy-MM-dd''T''HH:mm') : ''}">
        <input type="hidden"
               id="fechaFin"
               name="fechaFin"
               th:value="${call.fechaFin != null ? #temporals.format(call.fechaFin, 'yyyy-MM-dd''T''HH:mm') : ''}">
        <input type="hidden" id="duracionMinutos" th:field="*{duracionMinutos}">

        <div id="saveBanner" class="save-banner" role="status">
            <span id="saveBannerText">Llamada guardada correctamente. Puedes iniciar otro registro.</span>
            <button type="button" id="saveBannerClose">Aceptar</button>
        </div>

        <section class="form-section">
            <div class="section-kicker">Cliente</div>
            <div class="form-grid" style="margin-top:12px;">
                <div class="field">
                    <label>Nombre del cliente *</label>
                    <input class="form-input" th:field="*{clienteNombre}" required placeholder="Ej. Juan Perez">
                </div>
                <div class="field">
                    <label>Nombre comercio *</label>
                    <input class="form-input" th:field="*{nombreComercio}" required placeholder="Ej. Comercio Central">
                </div>
                <div class="field">
                    <label>Telefono *</label>
                    <input class="form-input"
                           th:field="*{clienteTelefono}"
                           required
                           type="text"
                           inputmode="numeric"
                           autocomplete="tel"
                           pattern="[0-9]{1,8}"
                           maxlength="8"
                           oninput="this.value = this.value.replace(/\D/g, '').slice(0, 8)"
                           placeholder="00000000">
                </div>
                <div class="field">
                    <label>Correo</label>
                    <input class="form-input" type="email" th:field="*{clienteCorreo}" placeholder="cliente@empresa.com">
                </div>
            </div>
        </section>

        <section class="form-section">
            <div class="section-kicker">Llamada</div>
            <div class="form-grid three" style="margin-top:12px;">
                <div class="field">
                    <label>Tipo de llamada *</label>
                    <select class="form-input" id="tipoLlamada" th:field="*{tipoLlamada}" required>
                        <option value="Entrante">Llamada Entrante</option>
                        <option value="Saliente">Llamada Saliente</option>
                        <option value="Seguimiento">Seguimiento</option>
                        <option value="Escalada">Escalada</option>
                    </select>
                </div>
                <div class="field">
                    <label>Resultado *</label>
                    <select class="form-input" id="resultado" th:field="*{resultado}" required
                            th:attr="data-current=${call.resultado}">
                        <option value="Atendida">Atendida</option>
                        <option value="Transferida">Transferida</option>
                        <option value="Solicita 2da llamada">Solicita 2da llamada</option>
                    </select>
                </div>
                <div class="field hidden" id="departmentBox">
                    <label>Departamento *</label>
                    <select class="form-input" id="departmentId" th:field="*{departmentId}">
                        <option value="">Selecciona un departamento</option>
                        <option th:each="department : ${departments}"
                                th:value="${department.id}"
                                th:text="${department.nombre}">
                            Departamento
                        </option>
                    </select>
                </div>
                <input type="hidden" th:field="*{estado}" value="Registrada">
                <div class="field full">
                    <label>Asunto *</label>
                    <select class="form-input" th:field="*{asunto}" required>
                        <option value="">Selecciona un asunto</option>
                        <option th:each="issue : ${issueTypes}"
                                th:value="${issue.nombre}"
                                th:text="${issue.nombre}">
                            Asunto
                        </option>
                    </select>
                </div>
                <div class="field full">
                    <label>Descripcion</label>
                    <textarea class="form-input" th:field="*{descripcion}" maxlength="1000" placeholder="Detalle breve de la llamada"></textarea>
                </div>
            </div>
        </section>

        <section class="form-section">
            <div class="section-kicker">Seguimiento</div>
            <div class="form-grid" style="margin-top:12px;">
                <div class="toggle-card">
                    <label>
                        <input type="checkbox" id="requiereSeguimiento" th:field="*{requiereSeguimiento}">
                        Requiere seguimiento
                    </label>
                    <div id="followUpBox" class="field hidden" style="margin-top:12px;">
                        <label>Fecha de seguimiento</label>
                        <input class="form-input"
                               id="fechaSeguimiento"
                               name="fechaSeguimiento"
                               type="datetime-local"
                               th:value="${call.fechaSeguimiento != null ? #temporals.format(call.fechaSeguimiento, 'yyyy-MM-dd''T''HH:mm') : ''}">
                    </div>
                </div>
                <div class="field">
                    <label>Plantilla rapida</label>
                    <select id="templateSelect" class="form-input">
                        <option value="">Selecciona una nota frecuente</option>
                        <option value="Cliente solicita seguimiento. Se deja registro para nueva llamada en la fecha indicada.">Seguimiento pendiente</option>
                        <option value="Cliente no contesta. Se recomienda nuevo intento en horario laboral.">No contesta</option>
                        <option value="Consulta resuelta durante la llamada. Cliente queda informado.">Consulta resuelta</option>
                    </select>
                </div>
                <div class="field full">
                    <label>Observaciones internas</label>
                    <textarea class="form-input" id="observaciones" th:field="*{observaciones}" maxlength="500" placeholder="Notas operativas para el equipo"></textarea>
                    <p id="counter" class="page-subtitle">0 / 500</p>
                </div>
            </div>
        </section>

        <footer class="footer-actions">
            <a th:if="${!popupMode}" class="rm-btn ghost" th:href="@{/calls}"><i data-lucide="x"></i>Cancelar</a>
            <button th:if="${popupMode}" type="button" class="rm-btn ghost" onclick="CallWorkspace.closeFloatingWindow()"><i data-lucide="x"></i>Cerrar ventana</button>
            <button class="rm-btn primary" type="submit"><i data-lucide="save"></i>Guardar llamada</button>
        </footer>
    </form>
</main>

<script th:src="@{/sneat/assets/js/call-popup.js}"></script>
<script>
    lucide.createIcons();

    const followCheck = document.getElementById('requiereSeguimiento');
    const followBox = document.getElementById('followUpBox');
    const followDate = document.getElementById('fechaSeguimiento');
    const observations = document.getElementById('observaciones');
    const counter = document.getElementById('counter');
    const templateSelect = document.getElementById('templateSelect');
    const tipoLlamada = document.getElementById('tipoLlamada');
    const resultado = document.getElementById('resultado');
    const departmentBox = document.getElementById('departmentBox');
    const departmentId = document.getElementById('departmentId');
    const durationInput = document.getElementById('duracionMinutos');
    const fechaInicio = document.getElementById('fechaInicio');
    const fechaFin = document.getElementById('fechaFin');
    const form = document.getElementById('callForm');
    const phoneInput = form.elements.clienteTelefono;
    const draftStatus = document.getElementById('draftStatus');
    const saveBanner = document.getElementById('saveBanner');
    const saveBannerText = document.getElementById('saveBannerText');
    const saveBannerClose = document.getElementById('saveBannerClose');

    const existingCall = Boolean(document.getElementById('callId')?.value);
    let pipOpenAttempted = false;
    let dirty = false;
    let saving = false;
    const draftStorageKey = `callDraft:${window.location.pathname}`;
    const resultOptionsByType = {
        Entrante: ['Atendida', 'Transferida', 'Solicita 2da llamada'],
        Saliente: ['Solicitud Grupo Soporte Cliq', 'Llamada Seguimiento'],
        Seguimiento: ['Atendida', 'No contesto', 'Reprogramada', 'Resuelta'],
        Escalada: ['Atendida', 'Transferida', 'Resuelta']
    };

    window.CallWorkspace = {
        persistDraftData,
        closeFloatingWindow
    };

    function isPopupMode() {
        return document.body?.dataset?.popupMode === 'true';
    }

    function isPipMode() {
        return document.body?.dataset?.pipMode === 'true';
    }

    function getFormData() {
        const data = {};
        new FormData(form).forEach((value, key) => {
            if (!['_csrf', 'fechaInicio', 'fechaFin', 'duracionMinutos'].includes(key)) {
                data[key] = value;
            }
        });
        data.requiereSeguimiento = followCheck.checked ? 'true' : '';
        return data;
    }

    function hasMeaningfulData(data) {
        return ['clienteNombre', 'nombreComercio', 'clienteTelefono', 'clienteCorreo', 'asunto', 'descripcion', 'observaciones']
            .some(key => String(data[key] || '').trim().length > 0);
    }

    function hasActiveCallDraft() {
        return dirty && hasMeaningfulData(getFormData());
    }

    function persistDraftData() {
        if (saving) {
            return;
        }

        const data = getFormData();
        dirty = hasMeaningfulData(data);

        if (!dirty) {
            localStorage.removeItem(draftStorageKey);
            updateDraftStatus(data);
            return;
        }

        data.__savedAt = String(Date.now());
        localStorage.setItem(draftStorageKey, JSON.stringify(data));
        updateDraftStatus(data);
    }

    function hydrateDraftData() {
        try {
            const raw = localStorage.getItem(draftStorageKey);
            if (!raw) {
                return;
            }

            const data = JSON.parse(raw);
            if (!hasMeaningfulData(data)) {
                return;
            }

            Object.entries(data).forEach(([name, value]) => {
                if (name.startsWith('__')) {
                    return;
                }

                const field = form.elements[name];
                if (!field) {
                    return;
                }

                if (field.type === 'checkbox') {
                    field.checked = value === 'true';
                } else {
                    field.value = value || '';
                }
            });

            resultado.dataset.current = data.resultado || resultado.value;
            syncResultOptions(data.resultado || resultado.value);
            dirty = true;
            syncFollowUp();
            updateCounter();
            updateDraftStatus(data);
        } catch (error) {
            console.warn('No fue posible restaurar el borrador de llamada', error);
        }
    }

    function updateDraftStatus(data = getFormData()) {
        if (!draftStatus) {
            return;
        }

        if (!hasMeaningfulData(data)) {
            draftStatus.innerText = 'Borrador listo';
            return;
        }

        const savedAt = data.__savedAt
            ? new Date(Number(data.__savedAt)).toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit' })
            : new Date().toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit' });
        draftStatus.innerText = `Borrador guardado ${savedAt}`;
    }

    function shouldOpenPipOnTabLeave() {
        return !isPopupMode()
            && !isPipMode()
            && !pipOpenAttempted
            && hasActiveCallDraft();
    }

    function openPipOnTabLeave() {
        if (!shouldOpenPipOnTabLeave()) {
            return;
        }

        pipOpenAttempted = true;
        persistDraftData();
        window.CallPopup?.openPictureInPicture(window.location.href, {
            fallbackToPopup: false
        });
    }

    function closePipOnTabReturn() {
        if (isPopupMode() || isPipMode()) {
            return;
        }

        window.CallPopup?.closePictureInPicture();
        pipOpenAttempted = false;
        hydrateDraftData();
    }

    function closeFloatingWindow() {
        window.__callSilentClose = true;
        window.close();
        setTimeout(() => {
            if (!window.closed) {
                window.location.href = '/calls';
            }
        }, 120);
    }

    function syncFollowUp() {
        followBox.classList.toggle('hidden', !followCheck.checked);
        followDate.required = followCheck.checked;
        if (!followCheck.checked) {
            followDate.value = '';
        }
    }

    function syncResultOptions(preferredValue = resultado.value) {
        const options = resultOptionsByType[tipoLlamada.value] || resultOptionsByType.Entrante;
        const current = options.includes(preferredValue)
            ? preferredValue
            : (options.includes(resultado.dataset.current) ? resultado.dataset.current : options[0]);

        resultado.innerHTML = '';
        options.forEach(value => {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            option.selected = value === current;
            resultado.appendChild(option);
        });

        syncDepartmentField();
    }

    function syncDepartmentField() {
        const isTransfer = resultado.value === 'Transferida';
        departmentBox.classList.toggle('hidden', !isTransfer);
        departmentId.required = isTransfer;

        if (!isTransfer) {
            departmentId.value = '';
        }
    }

    function updateCounter() {
        counter.innerText = `${observations.value.length} / 500`;
    }

    function localDateTimeValue(date = new Date()) {
        const offsetDate = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return offsetDate.toISOString().slice(0, 16);
    }

    function prepareSystemDates() {
        const now = localDateTimeValue();
        if (!existingCall) {
            fechaInicio.value = now;
            fechaFin.value = now;
            durationInput.value = 0;
            return;
        }

        if (!fechaInicio.value) {
            fechaInicio.value = now;
        }
        if (!fechaFin.value) {
            fechaFin.value = now;
        }
        durationInput.value = 0;
    }

    function clearDraft() {
        localStorage.removeItem(draftStorageKey);
        dirty = false;
        updateDraftStatus({});
    }

    function resetNewCallForm() {
        const csrfField = form.querySelector('input[name="_csrf"]');
        const csrfValue = csrfField?.value;

        form.reset();
        if (csrfField) {
            csrfField.value = csrfValue || '';
        }

        fechaInicio.value = '';
        fechaFin.value = '';
        durationInput.value = 0;
        templateSelect.value = '';
        syncFollowUp();
        updateCounter();
        clearDraft();
        form.querySelector('[name="clienteNombre"]')?.focus();
    }

    function showSaveBanner(codigo) {
        if (!saveBanner) {
            return;
        }

        saveBannerText.innerText = codigo
            ? `Llamada ${codigo} guardada correctamente. Puedes iniciar otro registro.`
            : 'Llamada guardada correctamente. Puedes iniciar otro registro.';
        saveBanner.classList.add('show');
        window.setTimeout(() => saveBanner.classList.remove('show'), 5200);
    }

    function csrfHeaders() {
        const token = document.querySelector('meta[name="_csrf"]')?.content;
        const header = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';
        return token ? { [header]: token } : {};
    }

    function setSavingState(isSaving) {
        saving = isSaving;
        form.classList.toggle('is-saving', isSaving);
        form.querySelectorAll('button[type="submit"]').forEach(button => {
            button.disabled = isSaving;
            if (isSaving) {
                button.dataset.originalText = button.innerHTML;
                button.innerHTML = '<i data-lucide="loader-circle"></i>Guardando';
            } else {
                button.innerHTML = button.dataset.originalText || 'Guardar llamada';
            }
        });
        lucide.createIcons();
    }

    async function saveNewCall() {
        prepareSystemDates();
        setSavingState(true);

        try {
            const response = await fetch('/api/calls/save', {
                method: 'POST',
                body: new FormData(form),
                credentials: 'same-origin',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    ...csrfHeaders()
                }
            });

            const contentType = response.headers.get('content-type') || '';
            const data = contentType.includes('application/json')
                ? await response.json()
                : {};

            if (!response.ok || data.success === false) {
                throw new Error(data.message || 'No fue posible guardar la llamada.');
            }

            clearDraft();
            resetNewCallForm();
            showSaveBanner(data.codigo);
        } catch (error) {
            dirty = true;
            alert(error.message || 'No fue posible guardar la llamada.');
        } finally {
            setSavingState(false);
        }
    }

    followCheck.addEventListener('change', syncFollowUp);
    phoneInput.addEventListener('input', () => {
        phoneInput.value = phoneInput.value.replace(/\D/g, '').slice(0, 8);
        persistDraftData();
    });
    tipoLlamada.addEventListener('change', () => {
        resultado.dataset.current = '';
        syncResultOptions();
        persistDraftData();
    });
    resultado.addEventListener('change', () => {
        resultado.dataset.current = resultado.value;
        syncDepartmentField();
        persistDraftData();
    });
    departmentId.addEventListener('change', persistDraftData);
    observations.addEventListener('input', updateCounter);
    form.addEventListener('input', persistDraftData);
    form.addEventListener('change', persistDraftData);
    templateSelect.addEventListener('change', () => {
        if (!templateSelect.value) return;
        observations.value = observations.value
            ? `${observations.value}\n${templateSelect.value}`
            : templateSelect.value;
        updateCounter();
        templateSelect.value = '';
        persistDraftData();
    });
    form.addEventListener('submit', async event => {
        if (!existingCall) {
            event.preventDefault();
            await saveNewCall();
            return;
        }

        prepareSystemDates();
        clearDraft();
    });

    window.addEventListener('beforeunload', event => {
        if (window.__callSilentClose) {
            return;
        }

        if (!hasActiveCallDraft()) {
            return;
        }

        persistDraftData();
        event.preventDefault();
        event.returnValue = '';
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            openPipOnTabLeave();
            return;
        }

        closePipOnTabReturn();
    });

    window.addEventListener('focus', closePipOnTabReturn);
    window.addEventListener('pageshow', closePipOnTabReturn);

    hydrateDraftData();
    syncResultOptions(resultado.dataset.current || resultado.value);
    syncFollowUp();
    updateCounter();
    saveBannerClose?.addEventListener('click', () => saveBanner.classList.remove('show'));
</script>
</body>
